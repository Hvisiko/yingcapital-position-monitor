name: Monitor public operation records

on:
  schedule:
    # 每五分钟运行一次，并避开 GitHub 整点调度高峰。
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "发送一条 Telegram 测试通知"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: yingcapital-position-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Restore monitor state
        shell: bash
        run: |
          mkdir -p .runtime
          if git fetch origin monitor-state:refs/remotes/origin/monitor-state; then
            for portfolio_id in 5075281354358777856 5296057151807357697 5247756265911980544 4532994172262753536; do
              if git cat-file -e "origin/monitor-state:${portfolio_id}.json" 2>/dev/null; then
                git show "origin/monitor-state:${portfolio_id}.json" > ".runtime/${portfolio_id}.json"
              elif [ "${portfolio_id}" = "5075281354358777856" ] && git cat-file -e origin/monitor-state:state.json 2>/dev/null; then
                # 兼容升级前的熬鹰资本单文件状态，绝不重置原基准。
                git show origin/monitor-state:state.json > ".runtime/${portfolio_id}.json"
              fi
            done
          else
            echo "No state branch yet; each trader will create an independent baseline."
          fi

      - name: Monitor latest operation records
        id: monitor
        if: ${{ !inputs.test_notification }}
        continue-on-error: true
        env:
          BINANCE_TRADER_1_PORTFOLIO_ID: "5075281354358777856"
          BINANCE_TRADER_1_NAME: "熬鹰资本"
          BINANCE_TRADER_2_PORTFOLIO_ID: "5296057151807357697"
          BINANCE_TRADER_2_NAME: "请填写昵称"
          BINANCE_TRADER_3_PORTFOLIO_ID: "5247756265911980544"
          BINANCE_TRADER_3_NAME: "万箭穿心BTC"
          BINANCE_TRADER_4_PORTFOLIO_ID: "4532994172262753536"
          BINANCE_TRADER_4_NAME: "Sky株式会社"
          MONITOR_TIMEZONE: "America/New_York"
          MONITOR_STATE_DIR: ".runtime"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: "src"
        run: python -m yingcapital_monitor

      - name: Send test notification
        id: notification_test
        if: ${{ inputs.test_notification }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: "src"
        run: python -m yingcapital_monitor --test-notification

      - name: Persist monitor state
        if: ${{ always() && hashFiles('.runtime/*.json') != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish_dir="$(mktemp -d)"
          cp .runtime/*.json "$publish_dir/"
          cd "$publish_dir"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b monitor-state
          git add *.json
          git commit -m "Update monitor state"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:monitor-state

      - name: Propagate monitor failure
        if: ${{ steps.monitor.outcome == 'failure' || steps.notification_test.outcome == 'failure' }}
        run: exit 1
